version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript < 6.1; TypeScript 7 has no JS compiler API yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']

  # Base images of apps/api/Dockerfile and apps/web/Dockerfile, pinned by digest (conventions §9).
  - package-ecosystem: docker
    directories: ['/apps/*']
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    commit-message:
      prefix: build(deps)
    groups:
      base-images:
        patterns: ['*']

  # Every image in docker-compose.yml is pinned by digest, so bumps arrive only as reviewed PRs (ADR-0017).
  # apps/api/test/images.ts reads postgres and redis from that file, so Testcontainers follows automatically.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    commit-message:
      prefix: build(deps)
    groups:
      compose-images:
        patterns: ['*']
