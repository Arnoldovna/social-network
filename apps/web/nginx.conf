# Included inside the http {} block by the nginx image (conf.d/*.conf).
#
# An add_header inside a location drops all server-level add_header lines, so caching and the security headers are
# decided by maps and every header is set once at server level. An empty value sends no header.
map $uri $cache_control {
  ~^/assets/               "public, max-age=31536000, immutable";
  ~^/(api|health|socket\.io)/  "";
  default                  "no-cache";
}

# nginx adds each security header only when the response does not carry its own. The API (helmet) sets them on every
# response it sends, so /api/ never gets a second, conflicting copy. Everything else gets nginx's: the SPA and its
# assets, and every response nginx generates itself, also under /api/ (413 for an oversized body, 502/504 while the
# API is down). Map values are evaluated when add_header runs, after the upstream response headers have arrived.
# CSP: no inline script and no inline style (ADR-0015, ADR-0017); blob: for the avatar upload preview (ADR-0010);
# connect-src 'self' covers fetch and the same-origin WebSocket.
map $upstream_http_content_security_policy $csp_header {
  ""       "default-src 'self'; script-src 'self'; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
  default  "";
}

map $upstream_http_x_frame_options $frame_options_header {
  ""       "DENY";
  default  "";
}

map $upstream_http_x_content_type_options $nosniff_header {
  ""       "nosniff";
  default  "";
}

map $upstream_http_referrer_policy $referrer_policy_header {
  ""       "strict-origin-when-cross-origin";
  default  "";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Without `always`: only 2xx/3xx responses get Cache-Control, so a 404 for a missing hashed asset (a stale
  # index.html during a deploy) is never cached as immutable for a year.
  add_header Cache-Control $cache_control;
  add_header X-Content-Type-Options $nosniff_header always;
  add_header Referrer-Policy $referrer_policy_header always;
  add_header X-Frame-Options $frame_options_header always;
  add_header Content-Security-Policy $csp_header always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Avatars are at most 2 MB (UPLOAD_MAX_BYTES, answered by the API with 413 file-too-large); anything above 3 MB
    # never reaches the API. nginx answers it with the same problem+json instead of an HTML error page (ADR-0010).
    client_max_body_size 3m;
    error_page 413 = @too_large;
  }

  location @too_large {
    default_type application/problem+json;
    return 413 '{"type":"tag:arnoldovna.github.io,2026:social-network:problem:file-too-large","title":"Payload too large","status":413,"detail":"The request body exceeds the limit of 3 MB."}';
  }

  location /health/ {
    proxy_pass http://api:3000;
  }

  # Socket.IO (websocket transport only, ADR-0008). The upgrade headers turn the proxied request into a WebSocket;
  # 75 s outlives Socket.IO's 25 s ping interval, so idle but healthy sockets are not cut (ADR-0017).
  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
  }

  location /assets/ {
    try_files $uri =404;
  }

  # SPA history fallback: every non-file path serves index.html; the router renders its own 404 page.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
